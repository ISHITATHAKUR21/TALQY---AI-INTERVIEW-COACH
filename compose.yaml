services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: talqy
      POSTGRES_USER: talqy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python configure.py first}
    volumes:
      - talqy_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talqy -d talqy"]
      interval: 3s
      timeout: 3s
      retries: 20
  mail:
    image: axllent/mailpit:v1.22
    ports:
      - "127.0.0.1:8025:8025"
  app:
    build:
      context: .
      args:
        VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://talqy:${POSTGRES_PASSWORD}@db:5432/talqy
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
volumes:
  talqy_db:
